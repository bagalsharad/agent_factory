[project]
name = "agent-factory"
version = "0.1.0"
description = "Agent Factory — Local-First AI Agent Engineering Platform. Design, Build, Test, Govern, and Deploy Intelligent Agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Agent Factory contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "typer>=0.12",
    "rich>=13.7",
    "pyjwt[crypto]>=2.9",
    "pypdf>=4.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
keyring = ["keyring>=25.0"]
anthropic = ["anthropic>=1.0"]
video = ["youtube-transcript-api>=1.2"]
media = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
agent-factory = "agent_factory.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "agent_factory/_bundled/templates"
"examples" = "agent_factory/_bundled/examples"
"migrations" = "agent_factory/_bundled/migrations"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "E501",   # line length is handled by `ruff format`
    "S101",   # assert is used for internal invariants
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class attrs on pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017", "PT011", "PT018"]  # compound asserts read better in scenario tests
"src/agent_factory/cli/**" = ["B904"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_factory"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ollama: requires a running local Ollama server with a configured model (skipped otherwise)",
    "postgres: requires AF_TEST_DATABASE_URL pointing to PostgreSQL (skipped otherwise)",
    "performance: performance measurements using the deterministic mock model",
]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]
