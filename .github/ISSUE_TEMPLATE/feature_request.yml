name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
  - type: textarea
    id: security
    attributes: {label: Security and governance impact, description: New tools, permissions, data flows or network access?}
