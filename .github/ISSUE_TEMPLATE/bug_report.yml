name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here — see SECURITY.md."
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Include the request id (X-Request-ID) if you have one.}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
  - type: input
    id: version
    attributes: {label: Version, description: Output of `agent-factory version`}
  - type: textarea
    id: doctor
    attributes: {label: "`agent-factory doctor --json` output (redact anything sensitive)", render: json}
