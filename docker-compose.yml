# Single-node production deployment (deployment target B). See docs/deployment/production.md.
#   cp deploy/compose/production.env.example deploy/compose/production.env   # edit secrets
#   docker compose --env-file deploy/compose/production.env up -d --build
# Only the reverse proxy publishes ports. PostgreSQL, the API and workers stay on the internal network.

x-app: &app
  image: ${AF_IMAGE:-agent-factory:local}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  env_file: deploy/compose/production.env
  environment:
    AF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentfactory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfactory}
    AF_DATA_DIR: /data
  volumes:
    - app-data:/data
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [backend]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentfactory}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    deploy:
      resources:
        limits: {memory: 1g}

  api:
    <<: *app
    command: ["serve"]
    environment:
      AF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentfactory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfactory}
      AF_DATA_DIR: /data
      AF_WORKER_MODE: external
    expose: ["8787"]
    deploy:
      resources:
        limits: {memory: 1g, cpus: "1.0"}

  worker:
    <<: *app
    command: ["worker"]
    environment:
      AF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentfactory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfactory}
      AF_DATA_DIR: /data
      AF_WORKER_MODE: external
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits: {memory: 2g, cpus: "2.0"}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${AF_PUBLIC_HTTP_PORT:-80}:80"
      - "${AF_PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      AF_DOMAIN: ${AF_DOMAIN:-localhost}
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, frontend]

  # Optional: local model server inside the stack (`docker compose --profile ollama up -d`).
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks: [backend]

  # Optional: OpenTelemetry collector (`--profile telemetry`), set AF_TELEMETRY_EXPORTER=otlp.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [telemetry]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [backend]

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
  ollama-models:

networks:
  backend:
    internal: true
  frontend:
